<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NUMBERS — 階層クリッカー</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{font:15px system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 14px;background:#101114;color:#e8e8e8}h1{font-size:18px}h2{font-size:15px;margin:0 0 12px}section{border:1px solid #36383e;border-radius:8px;padding:16px;margin:12px 0}html{touch-action:manipulation}button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:#292d35;color:#fff;border:1px solid #565b65;border-radius:5px;padding:10px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:hover:not(:disabled){background:#3a4050}.big{font-size:32px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.muted{color:#aaa;font-size:12px}.line{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:9px 0}.line>div{min-width:0}.line button{flex-shrink:0}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stats div{padding:9px;background:#1b1e23;border-radius:5px}#click{width:100%;font-size:18px;margin-top:12px;padding:16px}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button.active{background:#525b70}#log{min-height:1em}small{color:#aaa}label{display:inline-flex;gap:6px;align-items:center}@media(max-width:480px){.line{align-items:flex-start;flex-direction:column}.line button{width:100%}}</style></head><body><h1>NUMBERS / 階層クリッカー</h1><div class="muted">数字だけを積み上げる。自動保存・オフライン動作。</div><section><div class="muted">数字</div><div id="points" class="big">0</div><div class="stats"><div>毎秒 <b id="pps">0</b></div><div>クリック <b id="clickPower">1</b></div><div>累計獲得 <b id="total">0</b></div><div>転生倍率 <b id="multi">1</b></div></div><button id="click">+1 クリック</button></section><nav class="tabs"><button class="active" data-tab="production">生産</button><button data-tab="upgrades">強化</button><button data-tab="prestige">転生</button><button data-tab="achievements">実績</button><button data-tab="settings">設定</button></nav><section id="panel"></section><div id="log" class="muted" aria-live="polite"></div><script>
(()=>{'use strict';const KEY='numbers-clicker-v2';const generators=[['指',15,1],['機械',120,7],['工場',1400,45],['都市',18000,280],['惑星',300000,1800],['恒星',6500000,12000],['銀河',150000000,85000],['宇宙',5000000000,650000]];const defaultState=()=>({points:0,total:0,allTime:0,clicks:0,gens:Array(8).fill(0),clickLv:0,prodLv:0,prestige:0,crystals:0,crystalSpent:0,permLv:0,achievements:[],last:Date.now()});let s=defaultState();try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&typeof saved==='object'){s={...s,...saved};if(!Array.isArray(s.gens)||s.gens.length!==8)s.gens=Array(8).fill(0);if(!Array.isArray(s.achievements))s.achievements=[]}}catch(e){};let tab='production';const $=id=>document.getElementById(id);const fmt=n=>{if(!Number.isFinite(n))return '∞';return n.toLocaleString('ja-JP',{useGrouping:true,maximumFractionDigits:1})};const multiplier=()=> (1+s.crystals*.1)*(1+s.permLv*.25);const cp=()=> (1+s.clickLv)*(1+s.prodLv*.1)*multiplier();const pps=()=>generators.reduce((a,g,i)=>a+s.gens[i]*g[2],0)*(1+s.prodLv*.25)*multiplier();const genCost=i=>Math.ceil(generators[i][1]*1.16**s.gens[i]);const clickCost=()=>Math.ceil(10*1.65**s.clickLv);const prodCost=()=>Math.ceil(100*2.1**s.prodLv);const permCost=()=>5*(s.permLv+1);const gain=()=>Math.floor(Math.sqrt(s.total/100000));const save=()=>{s.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};const msg=t=>$('log').textContent=t;const award=n=>{if(!s.achievements.includes(n)){s.achievements.push(n);msg('実績解除：'+n)}};function check(){if(s.allTime>=100)award('100獲得');if(s.allTime>=1e5)award('10万獲得');if(s.allTime>=1e9)award('10億獲得');if(s.clicks>=100)award('100クリック');if(s.gens.reduce((a,b)=>a+b,0)>=100)award('設備100台');if(s.prestige>=1)award('初転生');if(s.crystals>=100)award('結晶100個')};function earn(n){if(n<=0)return;s.points+=n;s.total+=n;s.allTime+=n;check()};function spend(n){if(s.points+1e-8<n)return false;s.points-=n;return true};function el(tag,txt,cls){const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e};function row(parent,title,desc,label,enabled,fn){let r=el('div',undefined,'line'),d=el('div'),a=el('div',title),b=el('small',desc),btn=el('button',label);d.append(a,b);r.append(d,btn);btn.disabled=!enabled;btn.onclick=()=>{fn();render()};parent.append(r)};function renderPanel(){const p=$('panel');p.replaceChildren();if(tab==='production'){p.append(el('h2','生産設備'));generators.forEach((g,i)=>{let c=genCost(i);row(p,g[0]+' × '+s.gens[i],'基本生産 '+fmt(g[2])+'/秒・次の価格 '+fmt(c),'購入 '+fmt(c),s.points>=c,()=>{if(spend(c))s.gens[i]++})})}else if(tab==='upgrades'){p.append(el('h2','通常強化'));row(p,'クリック強化 Lv.'+s.clickLv,'クリック基礎値 +1','購入 '+fmt(clickCost()),s.points>=clickCost(),()=>{let c=clickCost();if(spend(c))s.clickLv++});row(p,'全体強化 Lv.'+s.prodLv,'設備生産 +25%/Lv、クリック +10%/Lv','購入 '+fmt(prodCost()),s.points>=prodCost(),()=>{let c=prodCost();if(spend(c))s.prodLv++})}else if(tab==='prestige'){p.append(el('h2','転生'));p.append(el('p','今回の累計獲得：'+fmt(s.total)));p.append(el('p','転生で獲得できる結晶：'+fmt(gain())+' 個'));p.append(el('p','結晶所持：'+fmt(s.crystals)+' 個（所持1個につき全生産・クリック +10%）'));row(p,'転生する','数字・設備・通常強化をリセット。結晶と永続強化は残る。','転生（+'+fmt(gain())+'）',gain()>=1,()=>{let n=gain();if(n<1||!confirm('転生しますか？ 通常進行はリセットされます。'))return;s.prestige++;s.crystals+=n;s.points=0;s.total=0;s.gens=Array(8).fill(0);s.clickLv=0;s.prodLv=0;check();save()});row(p,'永続強化 Lv.'+s.permLv,'1レベルにつき全生産・クリック +25%。結晶を消費する。','結晶 '+permCost(),s.crystals>=permCost(),()=>{let c=permCost();if(s.crystals>=c){s.crystals-=c;s.crystalSpent+=c;s.permLv++}})}else if(tab==='achievements'){p.append(el('h2','実績 '+s.achievements.length+'/7'));['100獲得','10万獲得','10億獲得','100クリック','設備100台','初転生','結晶100個'].forEach(n=>p.append(el('div',(s.achievements.includes(n)?'✓ ':'□ ')+n)))}else{p.append(el('h2','設定'));p.append(el('p','自動保存は約5秒ごと。離席中の生産は最大8時間分まで計算。'));row(p,'手動保存','現在の状態を保存','保存',true,()=>{save();msg('保存しました')});row(p,'最初からやり直す','保存データを消去','リセット',true,()=>{if(confirm('本当にすべての進行を削除しますか？')){s=defaultState();save();msg('リセットしました')}})}}function render(){ $('points').textContent=fmt(s.points);$('pps').textContent=fmt(pps());$('clickPower').textContent=fmt(cp());$('total').textContent=fmt(s.total);$('multi').textContent=fmt(multiplier())+'倍';$('click').textContent='+'+fmt(cp())+' クリック';renderPanel()};$('click').onclick=()=>{s.clicks++;earn(cp());render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});const offline=Math.min(Math.max(0,(Date.now()-(Number(s.last)||Date.now()))/1000),28800);if(offline>10){const earned=pps()*offline;earn(earned);msg('離席中の獲得：'+fmt(earned))}render();let last=performance.now(),paint=0;setInterval(()=>{let now=performance.now(),dt=Math.min((now-last)/1000,2);last=now;earn(pps()*dt);paint+=dt;if(paint>=.2){render();paint=0}},100);setInterval(save,5000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});window.addEventListener('pagehide',save)})();
</script></body></html>
